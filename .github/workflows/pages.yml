name: Qualify and publish Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node --check src/lab.mjs
      - run: python3 -m pip install playwright && python3 -m playwright install --with-deps chromium
      - name: GPU and Atlas browser qualification
        run: |
          python3 -m http.server 8000 >/tmp/hex-world-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/index.html >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/index.html >/dev/null
          python3 tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-world-browser-qa
          path: |
            /tmp/hex-world-qa.png
            /tmp/hex-world-workspace.png
            /tmp/hex-world-library.png
            /tmp/hex-world-hierarchy.png
          if-no-files-found: ignore
      - name: Actual published Atlas preview audit (separate external evidence)
        if: github.event_name == 'pull_request'
        timeout-minutes: 12
        run: |
          if git diff --name-only '${{ github.event.pull_request.base.sha }}' HEAD | grep -Eq '^(src/|vendor/atlas/|examples/|index\.html$|tests/browser_atlas_preview\.py$|\.github/workflows/pages\.yml$)'; then
            python3 -m http.server 8000 >/tmp/hex-world-atlas-http.log 2>&1 &
            server=$!
            trap 'kill "$server" 2>/dev/null || true' EXIT
            for i in {1..30}; do curl -fsS http://127.0.0.1:8000/index.html >/dev/null && break; sleep 1; done
            curl -fsS http://127.0.0.1:8000/index.html >/dev/null
            python3 tests/browser_atlas_preview.py
          fi
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: hex-world-atlas-preview-qa
          path: /tmp/hex-world-atlas-preview/
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src examples vendor _site/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: qualify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
