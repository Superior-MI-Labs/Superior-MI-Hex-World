<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superior MI Hex World</title><style>body{font:16px system-ui;background:#131b22;color:#e1e8e9;margin:24px}main{max-width:1000px;margin:auto}button,select{background:#263945;color:white;border:1px solid #587383;padding:8px;margin:4px}canvas{width:100%;height:auto;background:#1c2934;border:1px solid #425968}p{color:#b0c2cd}pre{white-space:pre-wrap}</style><main><h1>Superior MI Hex World</h1><p>Geometry laboratory · drag a vertex vertically, or select it and use the slider. Click a cell to select it, then drag its handles. Connected mode edits all solid cells sharing the corner; independent mode creates cliffs.</p><label>Subdivisions <select id="resolution"><option value="2">2 (2.5 ft)</option><option value="4">4 (1.25 ft)</option></select></label><label><input type="checkbox" id="connected" checked> Connected corners</label><label>Surface <select id="surface"><option value="upper">Upper</option><option value="lower">Lower</option></select></label><label>Vertex <select id="vertex"></select></label><label>Height <input id="height" type="range" min="0" max="2" step="1"><output id="heightValue"></output></label><div id="presets"></div><button id="reset">Reset terrain</button><button id="save">Export world</button><label>Import world <input id="load" type="file" accept=".json,application/json"></label><p id="message" role="status"></p><label>Simulation <select id="mode"><option>frozen</option><option>manual</option><option>real-time</option></select></label><button id="step">Advance 6 seconds</button><button id="fire">Persistent fire</button><button id="timed">Timed fire (5s)</button><button id="rotate">Rotate 60°</button><label>Zoom <input id="zoom" type="range" min="12" max="48" value="24"></label><label><input type="checkbox" id="wire" checked> Wireframe</label><canvas id="scene" width="900" height="450" style="touch-action:none"></canvas><pre id="status"></pre></main><script type="module" src="./src/lab.mjs"></script></html>
